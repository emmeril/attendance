<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Masuk · <%= appName %>
    </title>
    <link rel="stylesheet" href="/vendor/adminlte/css/adminlte.css">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/assets/app.css?v=20260826-5">
</head>

<body class="login-page">
    <div class="login-card">
        <div class="brand-mark"><span class="brand-dot"></span><span>
                <%= appName %>
            </span></div>
        <p class="eyebrow">OPERATIONS CONSOLE</p>
        <h1>Kelola kehadiran<br><em>tanpa celah.</em></h1>
        <p class="muted">Pantau seluruh perangkat Solution Finger dan tim Anda dari satu tempat.</p>
        <% if (error) { %>
            <div class="alert alert-danger py-2">
                <%= error %>
            </div>
            <% } %>
                <form method="post" action="/login"><label>Email</label><input class="form-control" type="email"
                        name="email" value="admin@attendance.local" required><label>Password</label><input
                        class="form-control" type="password" name="password" required><button
                        class="btn btn-primary w-100 mt-3" type="submit">Masuk ke dashboard <i
                            class="fa-solid fa-arrow-right"></i></button></form><small class="muted d-block mt-4">Default:
                    admin@attendance.local / admin123</small>
    </div>
</body>

</html>
